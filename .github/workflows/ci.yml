name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.23.2', '24.18.0']
    steps:
      # 必须取**完整历史**：多处「RED 基线」判据用 `git show <固定 sha>:<path>` 取证
      #   （如 test/f3-anchors.test.js:217/269 的 `294b4f9`、p2-deps-compat 的 `8d7815b`、
      #     f3-claim-writeface / f3-lane-claim-reason / p2-single-point 的同一批固定 sha）。
      #   checkout 默认 fetch-depth: 1（浅克隆）下这些对象不存在 ⇒ `git show` 报 bad object ⇒
      #   用例直接抛错（2026-10-25 实测：Linux CI 上 f3-anchors 的 T-2/T-3/T-4 三条红）。
      #   这些判据的语义是「证明该缺陷在历史提交里真实存在」，**不能**用 HEAD 代替、也不该改成 skip
      #   （skip 等于把 RED 证据面永久移出 CI）⇒ 解决方式是补齐历史，而不是弱化断言。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        working-directory: packages/dsh-punky-swarm
        run: npm ci
      # I-6(a)（test/install-selfcheck.test.js）的**前置**：该用例断言「自检脚本对
      # **真实 home**（os.userInfo().homedir）零写入」，并要求守卫面**可达构造**
      # （真实 home 下须有技能/预设文件，否则前后两次快照都是空的、守卫沦为空转）。
      # 干净的 CI runner 不存在这些目录 ⇒ 先前 CI 稳定失败于
      # `实测 files=0`。这里预置最小基线（两个目录各一个文件），使守卫在 CI 上
      # 也**非空转**——这比「无前置就跳过」更强：跳过等于把该守卫永久移出 CI。
      - name: Seed real-home fixture (precondition for I-6(a))
        run: |
          mkdir -p "$HOME/.agents/skills/ci-seed" "$HOME/.dsh/.agent-presets/punky-preset"
          printf 'seed\n' > "$HOME/.agents/skills/ci-seed/SKILL.md"
          printf 'seed\n' > "$HOME/.dsh/.agent-presets/punky-preset/ci-seed.md"
      - name: Run tests
        working-directory: packages/dsh-punky-swarm
        run: npm test
