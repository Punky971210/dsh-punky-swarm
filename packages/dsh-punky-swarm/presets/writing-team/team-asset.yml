{
  "team": "writing-team",
  "roles": {
    "extra": [
      "writing-planner",
      "drafter",
      "polisher",
      "publisher",
      "writing-auditor"
    ]
  },
  "layers": {
    "plan": {
      "roles": [
        "writing-planner"
      ],
      "skills": {
        "writing-planner": [
          "spec-writing",
          "writing-trio",
          "wechat-writing-style"
        ]
      }
    },
    "exec": {
      "roles": [
        "drafter",
        "polisher",
        "publisher"
      ],
      "skills": {
        "drafter": [
          "writing-trio",
          "wechat-writing-style"
        ],
        "polisher": [
          "humanizer",
          "lieflat-less-ai-tone",
          "revision-patterns",
          "writing-trio"
        ],
        "publisher": [
          "baoyu-markdown-to-html"
        ]
      }
    },
    "audit": {
      "roles": [
        "writing-auditor"
      ],
      "skills": {
        "writing-auditor": [
          "acceptance-gate",
          "review-execution",
          "humanizer"
        ]
      }
    }
  },
  "flows": {
    "plan": {
      "produce_field": "produce",
      "entry_requires": [],
      "contract": {
        "artifact_globs": [
          "plan/*spec.md"
        ],
        "required_sections": [
          "## 验收标准",
          "## 约束"
        ]
      }
    },
    "exec": {
      "produce_field": "outputs",
      "consume_field": "consume",
      "entry_requires": [
        "consume"
      ],
      "consumes_required": [
        "plan/"
      ],
      "consumes_required_per_lane": [
        "plan/"
      ],
      "targets": true,
      "gate_command": true
    },
    "audit": {
      "produce_field": "produce",
      "consume_field": "consume",
      "entry_requires": [
        "consume"
      ],
      "needhuman": true,
      "audit_contract": {
        "consumes_required": [
          "plan/",
          "exec/"
        ],
        "verdict": [
          "pass",
          "fail",
          "skip"
        ]
      }
    }
  }
}
