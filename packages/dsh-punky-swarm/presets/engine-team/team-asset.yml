{
  "team": "engine-team",
  "manifest": {
    "version": 3,
    "requires_engine": ">=0.4.4",
    "hash": "unhashed",
    "source": "引擎自建团队（做 dsh-punky-swarm 引擎自身改造的团队）：v3 重设计依据 docs/team-assets-redesign-20260917.md §2（E-1/E-2/E-3 诊断）/§3（标准形态）/§4（草案）；v1 由 P1（2026-09-16，批次 p1-team-asset-mandatory-20260916）新增。2026-09-18 通用化轮（用户裁决：通用团队流程 + exec 形态自建 + 其余键/规则按 software-team 模版）：删 `chain.needHuman`（引擎自述未接线子键，且仅本队声明）、删 `flows.exec.contract`（全仓 `contractOf` 只以 plan 调用 ⇒ 无运行期读点，且仅本队声明）、`roles.extra` 收敛为空（层内角色已由并集覆盖）；exec 形态 = **单步并行**（`exec-coder` ∥ `exec-verifier` ∥ `exec-reviewer`，**分支无 `deps`**），`pair_with:\"exec\"` 指该步；补 exec 消费门两键（`consumes_required` / `consumes_required_per_lane` = `[\"plan/\"]`）。`manifest.version` 于 2026-09-18 跨队统一轮按用户裁决统一为 **3**（五队同值）。**【2026-09-18 清债】顶层 `state_machine` 已随全队退役删除（零运行期消费者 ⇒ 声明即拒）**"
  },
  "roles": {
    "extra": [],
    "plan_leads": ["designer"],
    "audit_leads": ["reviewer"]
  },
  "layers": {
    "plan": {
      "roles": ["designer"],
      "skills": { "designer": ["spec-writing", "codebase-design"] }
    },
    "exec": {
      "roles": ["coder", "reviewer"],
      "skills": {
        "coder": ["dev-coder", "efficient-edit"],
        "reviewer": ["review-execution"]
      }
    },
    "audit": {
      "roles": ["reviewer", "supervisor"],
      "skills": {
        "reviewer": ["review-execution", "acceptance-gate"],
        "supervisor": ["acceptance-gate", "verification-before-completion"]
      }
    }
  },
  "flows": {
    "plan": {
      "produce_field": "produce",
      "entry_requires": [],
      "contract": { "artifact_globs": ["plan/*spec.md"], "required_sections": ["## 验收标准", "## 约束"] }
    },
    "exec": {
      "produce_field": "outputs",
      "consume_field": "consume",
      "entry_requires": ["consume"],
      "consumes_required": ["plan/"],
      "consumes_required_per_lane": ["plan/"],
      "targets": true,
      "gate_command": true
    },
    "audit": {
      "produce_field": "produce",
      "consume_field": "consume",
      "entry_requires": ["consume"],
      "needhuman": true,
      "audit_contract": {
        "criteria_from": "plan/**",
        "consumes_required": ["plan/", "exec/"],
        "verdict": ["pass", "fail", "skip"]
      }
    }
  },
  "chain": {
    "version": 3,
    "steps": [
      {
        "id": "plan",
        "layer": "plan",
        "role": "designer",
        "template": { "produce": ["plan/${branch}-spec.md"] },
        "branches": [
          { "id": "plan-designer", "role": "designer", "template": { "cmd": "产出规格与验收标准（${branch}）" } }
        ],
        "next": "exec"
      },
      {
        "id": "exec",
        "layer": "exec",
        "role": "coder",
        "template": { "produce": ["exec/${branch}.md"] },
        "branches": [
          { "id": "exec-coder", "role": "coder", "template": { "cmd": "实现变更并附自证读数（${branch}）" } },
          { "id": "exec-verifier", "role": "reviewer", "template": { "cmd": "独立复跑套件/检查器并按 plan 判据给原始读数（${branch}）（只读，不改码）" } },
          { "id": "exec-reviewer", "role": "reviewer", "template": { "cmd": "对抗式评审（${branch}）" } }
        ],
        "next": "audit-pair"
      },
      {
        "id": "audit-pair",
        "layer": "audit",
        "role": "supervisor",
        "pair_with": "exec",
        "template": { "id": "audit-${lane}", "cmd": "验收分支 ${lane} 的产物（按 plan 判据逐条对照）", "produce": ["audit/${lane}.md"] },
        "next": "accept"
      },
      {
        "id": "accept",
        "layer": "audit",
        "role": "supervisor",
        "join": "all",
        "terminal": true,
        "template": { "cmd": "交叉一致性核对 + 逐条判据对照", "produce": ["audit/acceptance-report.md"] }
      }
    ],
    "join": { "anyFailure": "pause" },
    "onFail": "pause",
    "rework": { "allowed": true, "max_attempts": 2, "escalate": "human" }
  }
}
