{
  "team": "design-team",
  "roles": {
    "extra": [
      "design-planner",
      "workflow-builder",
      "workflow-auditor",
      "producer"
    ]
  },
  "layers": {
    "plan": {
      "roles": [
        "design-planner"
      ],
      "skills": {
        "design-planner": [
          "spec-writing",
          "interaction-design-principles",
          "comfyui-use"
        ]
      }
    },
    "exec": {
      "roles": [
        "workflow-builder",
        "producer"
      ],
      "skills": {
        "workflow-builder": [
          "comfyui-use"
        ],
        "producer": [
          "comfyui-use"
        ]
      }
    },
    "audit": {
      "roles": [
        "workflow-auditor"
      ],
      "skills": {
        "workflow-auditor": [
          "acceptance-gate",
          "review-execution",
          "comfyui-use"
        ]
      }
    }
  },
  "flows": {
    "plan": {
      "produce_field": "produce",
      "entry_requires": [],
      "contract": {
        "artifact_globs": [
          "plan/*spec.md"
        ],
        "required_sections": [
          "## 验收标准",
          "## 约束"
        ]
      }
    },
    "exec": {
      "produce_field": "outputs",
      "consume_field": "consume",
      "entry_requires": [
        "consume"
      ],
      "consumes_required": [
        "plan/"
      ],
      "consumes_required_per_lane": [
        "plan/"
      ],
      "targets": true,
      "gate_command": true
    },
    "audit": {
      "produce_field": "produce",
      "consume_field": "consume",
      "entry_requires": [
        "consume"
      ],
      "needhuman": true,
      "audit_contract": {
        "consumes_required": [
          "plan/",
          "exec/"
        ],
        "verdict": [
          "pass",
          "fail",
          "skip"
        ]
      }
    }
  }
}
