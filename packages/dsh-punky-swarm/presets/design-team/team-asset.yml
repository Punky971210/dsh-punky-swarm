{
  "team": "design-team",
  "manifest": {
    "version": 3,
    "requires_engine": ">=0.4.4",
    "hash": "unhashed",
    "source": "角色与层职责见 skills/design-team/SKILL.md；执行侧能力指向 comfyui-use（Layer A 配方驱动：配方 -> 参数槽 -> 板1 comfy_* 工具序列 -> 质检 -> 审计回执），其迁入副本落 skills/design-team/references/comfyui/"
  },
  "roles": {
    "extra": ["design-planner", "workflow-builder", "workflow-auditor", "producer"],
    "plan_leads": ["design-planner"],
    "audit_leads": ["workflow-auditor"]
  },
  "layers": {
    "plan": {
      "roles": ["design-planner"],
      "skills": {
        "design-planner": ["spec-writing", "interaction-design-principles", "comfyui-use"]
      }
    },
    "exec": {
      "roles": ["workflow-builder", "producer"],
      "skills": {
        "workflow-builder": ["comfyui-use"],
        "producer": ["comfyui-use"]
      }
    },
    "audit": {
      "roles": ["workflow-auditor"],
      "skills": {
        "workflow-auditor": ["acceptance-gate", "review-execution", "comfyui-use"]
      }
    }
  },
  "flows": {
    "plan": {
      "produce_field": "produce",
      "entry_requires": [],
      "contract": { "artifact_globs": ["plan/*spec.md"], "required_sections": ["## 验收标准", "## 约束"] }
    },
    "exec": {
      "produce_field": "outputs",
      "consume_field": "consume",
      "entry_requires": ["consume"],
      "consumes_required": ["plan/"],
      "consumes_required_per_lane": ["plan/"],
      "targets": true,
      "gate_command": true
    },
    "audit": {
      "produce_field": "produce",
      "consume_field": "consume",
      "entry_requires": ["consume"],
      "needhuman": true,
      "audit_contract": {
        "criteria_from": "plan/**",
        "consumes_required": ["plan/", "exec/"],
        "verdict": ["pass", "fail", "skip"]
      }
    }
  },
  "chain": {
    "version": 3,
    "steps": [
      {
        "id": "plan",
        "layer": "plan",
        "role": "design-planner",
        "template": { "produce": ["plan/${branch}-spec.md"] },
        "branches": [
          { "id": "plan-designer", "role": "design-planner", "template": { "cmd": "产出设计规格与验收标准（${branch}）" } }
        ],
        "next": "exec-build"
      },
      {
        "id": "exec-build",
        "layer": "exec",
        "role": "workflow-builder",
        "template": { "produce": ["exec/${branch}/"] },
        "branches": [
          { "id": "exec-workflow-builder", "role": "workflow-builder", "template": { "cmd": "搭建 ComfyUI 工作流（${branch}）" } }
        ],
        "next": "audit-pair"
      },
      {
        "id": "audit-pair",
        "layer": "audit",
        "role": "workflow-auditor",
        "pair_with": "exec-build",
        "template": { "id": "audit-${lane}", "cmd": "验收分支 ${lane} 的产物（按 plan 判据逐条对照）", "produce": ["audit/${lane}.md"] },
        "next": "accept"
      },
      {
        "id": "accept",
        "layer": "audit",
        "role": "workflow-auditor",
        "join": "all",
        "terminal": true,
        "template": { "cmd": "交叉一致性核对 + 逐条判据对照", "produce": ["audit/acceptance-report.md"] }
      }
    ],
    "join": { "anyFailure": "pause" },
    "onFail": "pause",
    "rework": { "allowed": true, "max_attempts": 2, "escalate": "human" }
  }
}
