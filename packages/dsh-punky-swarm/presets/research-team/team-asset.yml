{
  "team": "research-team",
  "manifest": {
    "version": 3,
    "requires_engine": ">=0.4.4",
    "hash": "unhashed",
    "source": "三层自定义角色（research-planner / researcher / research-auditor）+ 本机既有调研技能池（spec-writing / decision-mapping / tech-benchmark-planning / ara-compiler / ara-research-manager / citation-evaluator / arxiv-translator / ara-rigor-reviewer）+ 本包自建手册（acceptance-gate）；技能声明值 = 宿主 SKILL.md frontmatter 的 name（加载名），非宿主目录名"
  },
  "roles": {
    "extra": ["research-planner", "researcher", "research-auditor"],
    "plan_leads": ["research-planner"],
    "audit_leads": ["research-auditor"]
  },
  "layers": {
    "plan": {
      "roles": ["research-planner"],
      "skills": {
        "research-planner": ["spec-writing", "decision-mapping", "tech-benchmark-planning", "ara-compiler"]
      }
    },
    "exec": {
      "roles": ["researcher"],
      "skills": {
        "researcher": ["ara-compiler", "ara-research-manager", "citation-evaluator", "arxiv-translator"]
      }
    },
    "audit": {
      "roles": ["research-auditor"],
      "skills": {
        "research-auditor": ["acceptance-gate", "ara-rigor-reviewer", "citation-evaluator"]
      }
    }
  },
  "flows": {
    "plan": {
      "produce_field": "produce",
      "entry_requires": [],
      "contract": { "artifact_globs": ["plan/*spec.md"], "required_sections": ["## 验收标准", "## 约束"] }
    },
    "exec": {
      "produce_field": "outputs",
      "consume_field": "consume",
      "entry_requires": ["consume"],
      "consumes_required": ["plan/"],
      "consumes_required_per_lane": ["plan/"],
      "targets": true,
      "gate_command": true
    },
    "audit": {
      "produce_field": "produce",
      "consume_field": "consume",
      "entry_requires": ["consume"],
      "needhuman": true,
      "audit_contract": {
        "criteria_from": "plan/**",
        "consumes_required": ["plan/", "exec/"],
        "verdict": ["pass", "fail", "skip"]
      }
    }
  },
  "chain": {
    "version": 3,
    "steps": [
      {
        "id": "plan",
        "layer": "plan",
        "role": "research-planner",
        "template": { "produce": ["plan/${branch}-spec.md"] },
        "branches": [
          { "id": "plan-researcher", "role": "research-planner", "template": { "cmd": "产出调研规格与验收标准（${branch}）" } }
        ],
        "next": "exec"
      },
      {
        "id": "exec",
        "layer": "exec",
        "role": "researcher",
        "template": { "produce": ["exec/research-report.md"] },
        "branches": [
          { "id": "exec-researcher", "role": "researcher", "template": { "cmd": "按规格执行调研并逐条溯源（${branch}）" } }
        ],
        "next": "audit-pair"
      },
      {
        "id": "audit-pair",
        "layer": "audit",
        "role": "research-auditor",
        "pair_with": "exec",
        "template": { "id": "audit-${lane}", "cmd": "验收分支 ${lane} 的产物（按 plan 判据逐条对照）", "produce": ["audit/${lane}.md"] },
        "next": "accept"
      },
      {
        "id": "accept",
        "layer": "audit",
        "role": "research-auditor",
        "join": "all",
        "terminal": true,
        "template": { "cmd": "交叉一致性核对 + 逐条判据对照", "produce": ["audit/acceptance-report.md"] }
      }
    ],
    "join": { "anyFailure": "pause" },
    "onFail": "pause",
    "rework": { "allowed": true, "max_attempts": 2, "escalate": "human" }
  }
}
