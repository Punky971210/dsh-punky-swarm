{
  "team": "research-team",
  "roles": {
    "extra": [
      "research-planner",
      "researcher",
      "research-auditor"
    ]
  },
  "layers": {
    "plan": {
      "roles": [
        "research-planner"
      ],
      "skills": {
        "research-planner": [
          "spec-writing",
          "decision-mapping",
          "tech-benchmark-planning",
          "ara-compiler"
        ]
      }
    },
    "exec": {
      "roles": [
        "researcher"
      ],
      "skills": {
        "researcher": [
          "ara-compiler",
          "ara-research-manager",
          "citation-evaluator",
          "arxiv-translator"
        ]
      }
    },
    "audit": {
      "roles": [
        "research-auditor"
      ],
      "skills": {
        "research-auditor": [
          "acceptance-gate",
          "ara-rigor-reviewer",
          "citation-evaluator"
        ]
      }
    }
  },
  "flows": {
    "plan": {
      "produce_field": "produce",
      "entry_requires": [],
      "contract": {
        "artifact_globs": [
          "plan/*spec.md"
        ],
        "required_sections": [
          "## 验收标准",
          "## 约束"
        ]
      }
    },
    "exec": {
      "produce_field": "outputs",
      "consume_field": "consume",
      "entry_requires": [
        "consume"
      ],
      "consumes_required": [
        "plan/"
      ],
      "consumes_required_per_lane": [
        "plan/"
      ],
      "targets": true,
      "gate_command": true
    },
    "audit": {
      "produce_field": "produce",
      "consume_field": "consume",
      "entry_requires": [
        "consume"
      ],
      "needhuman": true,
      "audit_contract": {
        "consumes_required": [
          "plan/",
          "exec/"
        ],
        "verdict": [
          "pass",
          "fail",
          "skip"
        ]
      }
    }
  }
}
