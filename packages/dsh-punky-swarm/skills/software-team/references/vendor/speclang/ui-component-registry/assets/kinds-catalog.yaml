# ============================================================
# Business Components — host-app-only UI components commonly
# used in the project but NOT available in Pod compilation.
# These are documented here to prevent Pod compilation errors.
# ============================================================
business_components:
  - kind: ColorUtils
    category: utility
    description: "Host app UIColor Category providing colorWithString: (hex string to UIColor)."
    pod_scope: host_only
    pod_safe_alternative: "[UIColor colorWithRed:R/255.0 green:G/255.0 blue:B/255.0 alpha:1.0]"
    framework_mapping:
      uikit: "UIColor+ColorUtils.h (Category) [HOST-ONLY]"
    notes: "If writing Pod code, parse the hex string manually or use inline RGB. Do NOT import ColorUtils.h."

  - kind: ThemeColors
    category: utility
    description: "Host app UIColor Category providing semantic theme colors (e.g., themeColorPrimary)."
    pod_scope: host_only
    pod_safe_alternative: "Use direct RGB values or accept UIColor via delegate/block from host"
    framework_mapping:
      uikit: "UIColor+Theme.h (Category) [HOST-ONLY]"
    notes: "Pod code should not depend on host theme system. Pass colors from host via init parameters."

  - kind: MBProgressHUDUtility
    category: utility
    description: "Host app MBProgressHUD Category providing convenience toast methods (makeToast:withText:, makeShortToast:withText:, etc.)."
    pod_scope: host_only
    pod_safe_alternative: "[MBProgressHUD showHUDAddedTo:view animated:YES] + [hud hide:YES afterDelay:delay]"
    framework_mapping:
      uikit: "MBProgressHUD+Utility.h (Category) [HOST-ONLY]"
    notes: "NEVER call makeToast: or makeShortToast: in Pod code. Use raw MBProgressHUD API from <MBProgressHUD/MBProgressHUD.h>."

  - kind: UIViewRoundCorner
    category: utility
    description: "Host app UIView Category providing roundCorner convenience methods."
    pod_scope: host_only
    pod_safe_alternative: "view.layer.cornerRadius = X; view.layer.masksToBounds = YES;"
    framework_mapping:
      uikit: "UIView+RoundCorner.h (Category) [HOST-ONLY]"
    notes: "Use Core Animation layer properties directly in Pod code."

  - kind: FontUtils
    category: utility
    description: "Host app UIFont Category providing font creation from JSON config or naming conventions."
    pod_scope: host_only
    pod_safe_alternative: "[UIFont systemFontOfSize:size] / [UIFont fontWithName:size]"
    framework_mapping:
      uikit: "UIFont+Utils.h (Category) [HOST-ONLY]"
    notes: "Use system font APIs directly in Pod code."
