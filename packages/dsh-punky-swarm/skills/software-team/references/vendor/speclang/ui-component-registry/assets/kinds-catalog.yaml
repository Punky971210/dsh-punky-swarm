version: 2.1

# Changelog from v1.0:
# - Added `uikit` framework_mapping to every kind (ObjC class name)
# - Added `pod_scope` annotations to kinds with Pod-scope implications
# - Added `business_components` section for host-app-only business UI components
# - Added `host_app_apis` section for commonly-used host-app-only APIs that cause compilation errors in Pods
# - Added `semantic_state_containers` for form semantics, async UI states, gestures, and animation primitives
# - Added HarmonyOS ArkUI mappings for ArkTS and Cangjie targets

full_surface_containers:
  - kind: Page
    description: "A full navigable screen that occupies the entire viewport. The default root kind for standard screens."
    operations:
      - name: render
        description: "Initialize and render the page content, completing the first build and mount of the UI tree."
      - name: show
        description: "Bring the page to the foreground and make it visible to the user without modifying the navigation stack."
      - name: hide
        description: "Hide the page from view while preserving its state and lifecycle without destroying it."
      - name: push
        description: "Push the page onto the navigation stack, navigating to a new page while keeping the current one in the stack."
      - name: pop
        description: "Pop the current page off the navigation stack and return to the previous page."
      - name: replace
        description: "Replace the current page at the top of the navigation stack with a new page; the current page is destroyed and cannot be returned to."
      - name: attach
        description: "Mount the page as a child view inside a specified parent container, typically used for nested container pages."
      - name: detach
        description: "Unmount the page from its parent container without necessarily destroying the page instance."
    framework_mapping:
      flutter: Scaffold
      swiftui: "View (root)"
      uikit: "UIViewController"
      jetpack_compose: Scaffold
      react_native: "View (root)"
      html_css: "<body> / <main>"
      arkui_arkts: "@Entry @Component struct / Navigation"
      arkui_cangjie: "ArkUI/Cangjie @Entry @Component struct / Navigation"

  - kind: Screen
    description: "A full-surface screen used within a multi-screen navigation container (e.g. TabBar, ViewPager). Prefer Screen over Page when the surface is one of several peer screens that the user switches between; use Page for a standalone navigable screen."
    operations:
      - name: render
        description: "Initialize and render the screen content, completing the first build and mount of the UI tree."
      - name: show
        description: "Bring the screen to the foreground and make it visible to the user without modifying the navigation stack."
      - name: hide
        description: "Hide the screen from view while preserving its state and lifecycle without destroying it."
      - name: push
        description: "Push the screen onto the navigation stack, navigating to a new screen while keeping the current one in the stack."
      - name: pop
        description: "Pop the current screen off the navigation stack and return to the previous screen."
      - name: replace
        description: "Replace the current screen at the top of the navigation stack with a new screen; the current screen is destroyed and cannot be returned to."
      - name: attach
        description: "Mount the screen as a child view inside a specified parent container, typically used for nested container screens."
      - name: detach
        description: "Unmount the screen from its parent container without necessarily destroying the screen instance."
    framework_mapping:
      flutter: Scaffold
      swiftui: "View (root)"
      uikit: "UIViewController"
      jetpack_compose: Scaffold
      react_native: "View (root)"
      html_css: "<body> / <main>"
      arkui_arkts: "@Component struct / NavDestination"
      arkui_cangjie: "ArkUI/Cangjie @Component struct / NavDestination"

  - kind: Modal
    description: "A full-surface modal overlay that covers the current screen. Dismissible by user action or programmatically."
    operations:
      - name: present
        description: "Animate the modal into view, blocking interaction with the content beneath."
      - name: dismiss
        description: "Animate the modal out of view and restore interaction with the underlying screen."
      - name: show
        description: "Make the modal visible without an entrance animation (e.g. restore from hidden state)."
      - name: hide
        description: "Hide the modal without destroying it, preserving its state for later reuse."
      - name: confirm
        description: "Trigger the primary affirmative action and close the modal."
      - name: cancel
        description: "Trigger the dismissal action without committing any changes."
    framework_mapping:
      flutter: "showDialog / showModalBottomSheet"
      swiftui: ".sheet() / .fullScreenCover()"
      uikit: "UIViewController (presentViewController:animated:completion:)"
      jetpack_compose: "Dialog / ModalBottomSheetLayout"
      react_native: Modal
      html_css: "<dialog> / .modal"
      arkui_arkts: "CustomDialogController / Dialog"
      arkui_cangjie: "ArkUI/Cangjie CustomDialogController / Dialog"

  - kind: Drawer
    description: "A slide-in panel from the left or right edge of the screen. Used for navigation menus or contextual panels."
    operations:
      - name: open
        description: "Slide the drawer into view from the screen edge."
      - name: close
        description: "Slide the drawer back off-screen."
      - name: toggle
        description: "Open the drawer if closed, or close it if open."
      - name: show
        description: "Make the drawer visible without a slide animation."
      - name: hide
        description: "Hide the drawer without a slide animation, preserving its state."
    framework_mapping:
      flutter: "Drawer / EndDrawer"
      swiftui: custom
      uikit: "UIViewController (custom transition) / MMDrawerController"
      jetpack_compose: "ModalDrawerSheet / ModalNavigationDrawer"
      react_native: DrawerLayoutAndroid
      html_css: "<aside> + CSS transform"
      arkui_arkts: "SideBarContainer / custom drawer"
      arkui_cangjie: "ArkUI/Cangjie SideBarContainer / custom drawer"

  - kind: Sheet
    description: "A bottom sheet that slides up from the bottom edge. Can be modal or non-modal."
    operations:
      - name: present
        description: "Slide the sheet up from the bottom edge into its initial detent position."
      - name: dismiss
        description: "Slide the sheet back down and remove it from the view hierarchy."
      - name: expand
        description: "Stretch the sheet to a larger detent or full-screen height."
      - name: collapse
        description: "Shrink the sheet back to a smaller detent or minimum height."
      - name: show
        description: "Make the sheet visible without an entrance animation."
      - name: hide
        description: "Hide the sheet without an exit animation, preserving its content state."
    framework_mapping:
      flutter: "showBottomSheet / DraggableScrollableSheet"
      swiftui: ".sheet() (detent-based)"
      uikit: "UIViewController (custom presentation) / UISheetPresentationController (iOS 15+)"
      jetpack_compose: ModalBottomSheet
      react_native: ActionSheetIOS
      html_css: custom
      arkui_arkts: "bindSheet / custom bottom sheet"
      arkui_cangjie: "ArkUI/Cangjie bindSheet / custom bottom sheet"

  - kind: FullscreenOverlay
    description: "A full-screen overlay that sits above all other content. Used for loading states, image viewers, or immersive content."
    operations:
      - name: present
        description: "Mount and animate the overlay into the topmost layer of the window."
      - name: dismiss
        description: "Animate the overlay out and remove it from the window layer."
      - name: show
        description: "Make the overlay visible without an entrance animation."
      - name: hide
        description: "Hide the overlay without removing it, allowing quick re-show."
    framework_mapping:
      flutter: "Overlay / OverlayEntry"
      swiftui: ".overlay() / ZStack"
      uikit: "UIView (window-level) / UIViewController (modal, fullScreen)"
      jetpack_compose: "Popup / Box + zIndex"
      react_native: "Modal (transparent)"
      html_css: "position: fixed + z-index"
      arkui_arkts: "Stack overlay / Dialog"
      arkui_cangjie: "ArkUI/Cangjie Stack overlay / Dialog"

layout_containers:
  - kind: VerticalStack
    description: "Linear layout that arranges children vertically, top to bottom."
    operations:
      - name: addChild
        description: "Append a new child view to the end of the vertical stack."
      - name: removeChild
        description: "Remove a specific child view from the stack."
      - name: reorder
        description: "Change the display order of children within the stack."
      - name: measure
        description: "Calculate the intrinsic size required by the stack and its children."
      - name: layout
        description: "Apply final position and size to each child according to the vertical axis."
    framework_mapping:
      flutter: Column
      swiftui: VStack
      uikit: "UIStackView (axis: .vertical)"
      jetpack_compose: Column
      react_native: "View (flexDirection: column)"
      html_css: "display: flex; flex-direction: column"
      arkui_arkts: "Column"
      arkui_cangjie: "ArkUI/Cangjie Column"

  - kind: HorizontalStack
    description: "Linear layout that arranges children horizontally, left to right."
    operations:
      - name: addChild
        description: "Append a new child view to the end of the horizontal stack."
      - name: removeChild
        description: "Remove a specific child view from the stack."
      - name: reorder
        description: "Change the display order of children within the stack."
      - name: measure
        description: "Calculate the intrinsic size required by the stack and its children."
      - name: layout
        description: "Apply final position and size to each child according to the horizontal axis."
    framework_mapping:
      flutter: Row
      swiftui: HStack
      uikit: "UIStackView (axis: .horizontal)"
      jetpack_compose: Row
      react_native: "View (flexDirection: row)"
      html_css: "display: flex; flex-direction: row"
      arkui_arkts: "Row"
      arkui_cangjie: "ArkUI/Cangjie Row"

  - kind: HorizontalPair
    description: "Exactly two elements side by side. A constrained form of HorizontalStack."
    operations:
      - name: addChild
        description: "Set one of the two child slots (leading or trailing)."
      - name: removeChild
        description: "Clear a child slot, leaving it empty."
      - name: measure
        description: "Calculate the combined width and the height of the taller child."
      - name: layout
        description: "Position the two children side by side with equal or proportional widths."
    framework_mapping:
      flutter: Row
      swiftui: HStack
      uikit: "UIStackView (axis: .horizontal, 2 arrangedSubviews)"
      jetpack_compose: Row
      react_native: "View (flexDirection: row)"
      html_css: "display: flex; flex-direction: row"
      arkui_arkts: "Row"
      arkui_cangjie: "ArkUI/Cangjie Row"

  - kind: Grid
    description: "Two-dimensional grid layout with rows and columns."
    operations:
      - name: addCell
        description: "Insert a new cell into the grid at the next available position."
      - name: removeCell
        description: "Remove a specific cell from the grid."
      - name: reorder
        description: "Rearrange cells within the grid."
      - name: selectItem
        description: "Select or activate a grid cell by index or identity, typically in response to tapping or clicking the cell."
      - name: span
        description: "Make a cell occupy multiple columns or rows."
      - name: measure
        description: "Calculate the total size required by the grid given its column and row definitions."
      - name: layout
        description: "Place each cell into its assigned grid area."
    framework_mapping:
      flutter: GridView
      swiftui: "LazyVGrid / LazyHGrid"
      uikit: "UICollectionView + UICollectionViewCompositionalLayout"
      jetpack_compose: "LazyVerticalGrid / LazyHorizontalGrid"
      react_native: "FlatList (numColumns)"
      html_css: "display: grid"
      arkui_arkts: "Grid"
      arkui_cangjie: "ArkUI/Cangjie Grid"

  - kind: Overlay
    description: "Stacking layout where children are layered on top of each other. Used for floating elements, badges, or absolute-positioned content."
    operations:
      - name: addChild
        description: "Add a new layer on top of the existing stack."
      - name: removeChild
        description: "Remove a specific layer from the stack."
      - name: reorderZ
        description: "Change the z-order of a child to bring it forward or push it back."
      - name: align
        description: "Set the alignment anchor of a child within the overlay bounds."
      - name: show
        description: "Make the overlay container visible."
      - name: hide
        description: "Hide the overlay container without destroying its children."
    framework_mapping:
      flutter: Stack
      swiftui: ZStack
      uikit: "UIView (addSubview with constraints / frame overlap)"
      jetpack_compose: Box
      react_native: "View (position: absolute)"
      html_css: "position: relative/absolute"
      arkui_arkts: "Stack"
      arkui_cangjie: "ArkUI/Cangjie Stack"

  - kind: Frame
    description: "Generic container with optional background, border, padding, and size constraints. The most basic grouping element."
    operations:
      - name: addChild
        description: "Add a child view inside the frame."
      - name: removeChild
        description: "Remove a child view from the frame."
      - name: measure
        description: "Calculate the frame's size including padding and child content."
      - name: layout
        description: "Apply the frame's position, size, background, and border."
      - name: show
        description: "Make the frame and its children visible."
      - name: hide
        description: "Hide the frame and its children without removing them from the hierarchy."
    framework_mapping:
      flutter: "Container / SizedBox"
      swiftui: "View + .frame() + .background()"
      uikit: "UIView (with layout constraints or frame)"
      jetpack_compose: "Box / Surface"
      react_native: View
      html_css: "<div>"
      arkui_arkts: "Column / Stack with modifiers"
      arkui_cangjie: "ArkUI/Cangjie Column / Stack with modifiers"

  - kind: ScrollContainer
    description: "A scrollable container that allows content to exceed the viewport bounds."
    operations:
      - name: scrollTo
        description: "Scroll to an absolute offset position (x, y)."
      - name: scrollBy
        description: "Scroll by a relative delta from the current scroll position."
      - name: scrollToTop
        description: "Instantly or smoothly scroll to the very beginning of the content."
      - name: scrollToBottom
        description: "Instantly or smoothly scroll to the very end of the content."
      - name: measure
        description: "Calculate the viewport size and total scrollable content size."
      - name: layout
        description: "Position child content within the scrollable area."
    framework_mapping:
      flutter: "SingleChildScrollView / ListView"
      swiftui: "ScrollView / List"
      uikit: "UIScrollView"
      jetpack_compose: "Modifier.verticalScroll() / LazyColumn"
      react_native: ScrollView
      html_css: "overflow: scroll/auto"
      arkui_arkts: "Scroll / Scrollable"
      arkui_cangjie: "ArkUI/Cangjie Scroll / Scrollable"

  - kind: List
    description: "A scrollable list of repeating items. Supports lazy rendering for large datasets."
    operations:
      - name: addItem
        description: "Append or insert a new item into the list data source."
      - name: removeItem
        description: "Delete an item from the list data source by index or identity."
      - name: selectItem
        description: "Select or activate a list item by index or identity, typically in response to tapping or clicking an item row."
      - name: scrollTo
        description: "Scroll the list to an absolute pixel offset."
      - name: scrollToIndex
        description: "Scroll the list so that the item at a given index is visible."
      - name: reorder
        description: "Drag and drop to rearrange items within the list."
      - name: reload
        description: "Replace or refresh the list data source and re-render visible items."
      - name: measure
        description: "Calculate the total height of all rendered items."
      - name: layout
        description: "Position each visible item cell within the list viewport."
    framework_mapping:
      flutter: "ListView / ListView.builder"
      swiftui: List
      uikit: "UITableView"
      jetpack_compose: "LazyColumn / LazyRow"
      react_native: "FlatList / SectionList"
      html_css: "<ul> / <ol>"
      arkui_arkts: "List"
      arkui_cangjie: "ArkUI/Cangjie List"

  - kind: FlexContainer
    description: "Flexible layout that distributes space among children with grow/shrink ratios."
    operations:
      - name: addChild
        description: "Add a new flex item to the container."
      - name: removeChild
        description: "Remove a flex item from the container."
      - name: expand
        description: "Increase a child's flex-grow factor so it takes more available space."
      - name: shrink
        description: "Increase a child's flex-shrink factor so it yields space under constraint."
      - name: distribute
        description: "Apply justify-content / align-items rules to spread children across the main and cross axes."
      - name: measure
        description: "Run the flex algorithm to determine each child's resolved size."
      - name: layout
        description: "Commit the computed positions and sizes to each child."
    framework_mapping:
      flutter: "Flex / Expanded / Flexible"
      swiftui: "Spacer() / .layoutPriority()"
      uikit: "UIStackView (distribution: .fillProportionally / custom constraints)"
      jetpack_compose: "BoxWithConstraints / FlowRow"
      react_native: "flex property"
      html_css: "flex-grow / flex-shrink / flex-basis"
      arkui_arkts: "Flex"
      arkui_cangjie: "ArkUI/Cangjie Flex"

  - kind: WrapContainer
    description: "Layout that wraps children to the next line when horizontal space is exhausted."
    operations:
      - name: addChild
        description: "Add a new child view; it will be placed on the current or next line as space allows."
      - name: removeChild
        description: "Remove a child view and re-flow remaining children."
      - name: wrap
        description: "Force a line break before a specific child, pushing it to the next row."
      - name: measure
        description: "Calculate the total height after wrapping children across available width."
      - name: layout
        description: "Position children row-by-row, wrapping when a row is full."
    framework_mapping:
      flutter: Wrap
      swiftui: custom
      uikit: "Custom layout (compute size per line) / UICollectionViewFlowLayout"
      jetpack_compose: "FlowRow / FlowColumn"
      react_native: "View (flexWrap: wrap)"
      html_css: "flex-wrap: wrap"
      arkui_arkts: "Flex(wrap)"
      arkui_cangjie: "ArkUI/Cangjie Flex(wrap)"

  - kind: Table
    description: "Tabular data display with rows and columns, supporting sorting and column resizing."
    operations:
      - name: addRow
        description: "Append or insert a new data row into the table."
      - name: removeRow
        description: "Delete a row from the table by index or identity."
      - name: sort
        description: "Sort all rows by a specified column in ascending or descending order."
      - name: resizeColumn
        description: "Adjust the width of a column by dragging its header boundary."
      - name: measure
        description: "Calculate the minimum width for each column based on cell content."
      - name: layout
        description: "Position all cells within their assigned column and row bounds."
    framework_mapping:
      flutter: Table
      swiftui: Table
      uikit: "UITableView (sectioned) / custom grid"
      jetpack_compose: custom
      react_native: custom
      html_css: "<table>"
      arkui_arkts: "Grid / custom table"
      arkui_cangjie: "ArkUI/Cangjie Grid / custom table"

  - kind: SafeArea
    description: "Container that insets its children to avoid system UI (notch, status bar, home indicator)."
    operations:
      - name: inset
        description: "Apply safe-area insets to the container's padding so children stay clear of system UI."
      - name: adapt
        description: "Re-compute and update insets when the device orientation or safe-area changes."
      - name: measure
        description: "Calculate the available content area after subtracting safe-area insets."
      - name: layout
        description: "Position children within the inset content bounds."
    framework_mapping:
      flutter: SafeArea
      swiftui: ".safeAreaInset()"
      uikit: "UIView (respect safeAreaInsets / additionalSafeAreaInsets)"
      jetpack_compose: "Modifier.safeContentPadding()"
      react_native: SafeAreaView
      html_css: "env(safe-area-inset-*)"
      arkui_arkts: "safe-area padding / expandSafeArea"
      arkui_cangjie: "ArkUI/Cangjie safe-area padding / expandSafeArea"

  - kind: Spacer
    description: "Flexible empty space that pushes adjacent elements apart."
    operations:
      - name: expand
        description: "Grow the spacer to fill all remaining available space along the main axis."
      - name: shrink
        description: "Allow the spacer to compress when siblings need more space."
      - name: measure
        description: "Report the spacer's resolved size after flex or constraint calculation."
    framework_mapping:
      flutter: "Spacer / Expanded"
      swiftui: Spacer
      uikit: "UIView (flexible width/height constraint) / space in UIStackView"
      jetpack_compose: "Spacer / Modifier.weight()"
      react_native: "View (flex: 1)"
      html_css: "flex-grow: 1"
      arkui_arkts: "Blank"
      arkui_cangjie: "ArkUI/Cangjie Blank"

semantic_state_containers:
  - kind: Form
    description: "A semantic container for input fields that are validated, submitted, reset, and tracked as a single unit."
    operations:
      - name: submit
        description: "Attempt to submit the current form values, usually after running validation and blocking duplicate submissions."
      - name: validate
        description: "Run all field-level and form-level validation rules and update the visible validation state."
      - name: reset
        description: "Restore all fields to their initial values and clear dirty, touched, submitting, and validation state."
      - name: setSubmitting
        description: "Mark the form as actively submitting so controls can disable duplicate actions and show progress."
      - name: setDirty
        description: "Mark the form as changed from its initial values, enabling unsaved-change prompts or submit controls."
      - name: setPristine
        description: "Mark the form as unchanged from its initial values after reset or successful persistence."
      - name: setTouched
        description: "Mark one or more fields as visited by the user so validation messages can be shown at the right time."
      - name: setValid
        description: "Mark the current form values as valid and clear any form-level invalid state."
      - name: setInvalid
        description: "Mark the form as invalid and attach one or more validation errors to fields or to the form itself."
      - name: setError
        description: "Attach a submit-level or form-level error that is not owned by a single field."
      - name: clearErrors
        description: "Remove field-level and form-level errors without changing the current field values."
      - name: enable
        description: "Allow the user to interact with all enabled fields and submit controls in the form."
      - name: disable
        description: "Prevent user interaction with the form while preserving its current values and validation state."
    framework_mapping:
      flutter: "Form / FormState"
      swiftui: "Form + @State validation model"
      uikit: "UIView / UITableView form + validation coordinator"
      jetpack_compose: "Column + rememberSaveable form state"
      react_native: "View + form state library or local state"
      html_css: "<form>"
      arkui_arkts: "Column + @State validation model"
      arkui_cangjie: "ArkUI/Cangjie Column + @State validation model"

  - kind: ValidationMessage
    description: "A message associated with a field or form that explains validation errors, warnings, or success state."
    operations:
      - name: setMessage
        description: "Replace the visible validation text with a new localized message."
      - name: setError
        description: "Show the message as an error that blocks successful validation or submission."
      - name: setWarning
        description: "Show the message as a warning that should be noticed but may not block submission."
      - name: setSuccess
        description: "Show the message as positive validation feedback, such as an available username."
      - name: clear
        description: "Remove the validation message and return the associated field or form to a neutral state."
      - name: show
        description: "Make the validation message visible to users and assistive technologies."
      - name: hide
        description: "Hide the validation message while preserving its current text and severity."
      - name: announce
        description: "Request an accessibility announcement for the current message after validation changes."
    framework_mapping:
      flutter: "Text / FormField.errorText"
      swiftui: "Text + accessibility announcement"
      uikit: "UILabel + UIAccessibility announcement"
      jetpack_compose: "Text + supportingText/error state"
      react_native: "Text + accessibilityLiveRegion"
      html_css: "<p role='alert'> / aria-describedby"
      arkui_arkts: "Text + accessibility announcement"
      arkui_cangjie: "ArkUI/Cangjie Text + accessibility announcement"

  - kind: AsyncContent
    description: "A stateful content region that switches between loading, content, empty, error, partial, and refreshing UI states."
    operations:
      - name: setLoading
        description: "Show the initial or blocking loading state and suppress normal content interaction until data is available."
      - name: setContent
        description: "Show successfully loaded content and hide loading, empty, and error presentations."
      - name: setEmpty
        description: "Show the empty state when loading succeeded but returned no displayable data."
      - name: setError
        description: "Show a recoverable failure state with an optional message, diagnostic code, and retry action."
      - name: setPartial
        description: "Show available content while indicating that some requested data failed or is still unavailable."
      - name: setRefreshing
        description: "Keep existing content visible while showing that a background refresh is in progress."
      - name: retry
        description: "Trigger the configured retry action from an error, partial, or stale state."
      - name: cancel
        description: "Cancel the in-flight load or refresh operation when the user leaves or explicitly aborts."
      - name: setStale
        description: "Mark displayed content as out of date while it remains visible and usable."
      - name: clearState
        description: "Return the region to its neutral state before a new lifecycle starts."
    states:
      - loading
      - content
      - empty
      - error
      - partial
      - refreshing
      - stale
    framework_mapping:
      flutter: "FutureBuilder / StreamBuilder / state-driven Widget switch"
      swiftui: "View enum state + switch"
      uikit: "Container UIView / UIViewController with state renderer"
      jetpack_compose: "UiState sealed class + when"
      react_native: "Conditional render from async state"
      html_css: "state container + conditional DOM"
      arkui_arkts: "@State union + conditional rendering"
      arkui_cangjie: "ArkUI/Cangjie @State union + conditional rendering"

  - kind: GestureRegion
    description: "A semantic wrapper that binds pointer, touch, mouse, keyboard, or accessibility gestures to child content."
    operations:
      - name: tap
        description: "Trigger the primary activation gesture from a quick pointer, touch, keyboard, or accessibility action."
      - name: doubleTap
        description: "Trigger a secondary activation after two quick taps or clicks on the same region."
      - name: longPress
        description: "Trigger a press-and-hold action after the pointer or touch remains down for a configured duration."
      - name: swipe
        description: "Recognize a directional fling or drag gesture and report its direction."
      - name: panStart
        description: "Begin continuous pointer or touch tracking and capture the initial position."
      - name: pan
        description: "Report continuous movement deltas while the pointer or touch remains active."
      - name: panEnd
        description: "End continuous movement tracking and report final velocity or displacement."
      - name: pinch
        description: "Recognize a two-pointer scale gesture and report the scale factor."
      - name: rotate
        description: "Recognize a two-pointer rotation gesture and report the angle delta."
      - name: hover
        description: "React when a mouse, stylus, or compatible pointer enters or moves over the region."
      - name: focus
        description: "Move keyboard or accessibility focus to the gesture region."
      - name: blur
        description: "Remove keyboard or accessibility focus from the gesture region."
      - name: enable
        description: "Allow the region to recognize configured gestures."
      - name: disable
