# dsh-punky-swarm bundle patch — the layer applied when a profile lists this bundle.
- insert:
    - id: dsh-punky-swarm
      name: 'dsh-punky-swarm'
      config:
        # AIP 装配开关：enabled=true 时生成 14 工具 6 属性目录并挂载 GET /api/dsh-punky-swarm/tools；
        # 默认 true（AIP 兼容为主线；目录生成 + 只读 /tools 端点，零新增工具、零行为破坏）。
        # toolVersion 可选覆盖引擎版本。关闭（false）则零运行时开销，行为与既有版本完全一致。
        aip:
          enabled: true
        # 模式跟随（2026-09-16 用户裁决：**全局装载、不全局生效**）：蟛蜞治理（难度门禁 / G1 档位门禁 /
        #   套件工具）只在这些 agent preset 的会话里生效；**名单外模式门禁全放行且不计数**（其他模式零影响）。
        #   `jiufeng` 为**旧 preset id 的过渡别名**（改名前的会话 header 已记该值）——保留以保证既有会话
        #   续跑且治理不中断；待存量会话结束后于下个大版本移除。
        #   热更：<root>/config/runtime.json 写 {"modes":{"gate":[...]}} 即生效、无需重启；
        #   `null` = 回到旧行为（全模式生效），`[]` = 显式停用。缺省（未配置）亦为全模式生效。
        modes:
          gate: ['punky-preset', 'jiufeng']
        # 派发套件（C/E 阶段）：引擎自派（lane_dispatch → ctx.subagents.startContinuable）所用宿主
        #   subagent provider 名。宿主默认 provider = `spawn`（dsh-base 挂载 dsh-subagent-spawn-in-process,
        #   providerName: spawn）；`gate` 缺省 `'warn'`（只留痕不拦）——切 `enforce` 的前提是模式跟随已活体验证通过，
        #   否则非白名单模式的 `subagent` 派发会被 `GATE_SUBAGENT_OUTSIDE_LANES` 卡死。
        dispatch:
          provider: spawn
        # 能力补全装配（默认全开——AIP 为主线 + 治理能力全开；显式 enabled:false 可逐键关闭）
        # 诊断桥接（trajectory）：订阅 trajectory 异常 → sessionId→lane 映射 → notify（默认 notify-only，不自动结算）；
        #   autoFail=false（默认）异常不自动 member_settle failed；failConfidence 为 loop_deadlock 自动 failed 的置信阈值。
        capabilities:
          # 发现服务（ADP）：enabled=true 时挂载 POST /api/dsh-punky-swarm/discover +
          #   GET /.well-known/aip（消费 tool catalog + agent-descriptor 目录）；nodes 可逐节点 active=false 隐藏（默认 active=true）。
          discovery:
            enabled: true
          trajectory:
            enabled: true
            autoFail: false
            failConfidence: 0.85
          # mailbox 环防护（budget）：enabled=true 时 outbox/broadcast 发送前经 checkBudget——
          #   maxChainHops（链跳数上限）/maxChainRoundTrips（有序对往返上限）可配；inbox（Leader→worker 下行派发）永不受限；
          #   显式 enabled:false 可关闭（关闭时现有 mailbox 调用零感知：不声明 meta.chain = 恒新链，不被拒）。
          budget:
            enabled: true
            maxChainHops: 4
            maxChainRoundTrips: 2
          # lane 过期检测（watch/heartbeat）：enabled=true 时挂 watchdog 定时器并注册 lane_heartbeat 工具——
          #   intervalsMinutes 退避档位（分钟，默认 [10,20,30]，冷场越久追问间隔越长）；maxMissed 硬停拍数
          #   （默认 3，连续 N 拍无活动 → appendEvent('lane.stalled') 停止追问，只标记不自动处置）；
          #   scanIntervalMinutes watchdog 扫描间隔（默认 1）；probeTemplate 可选覆写追问模板（{lane}/{batchId}/{missed} 占位）。
          #   longrun 子键（长跑档探针，出厂默认开）：running lane 持续超
          #   maxDurationMs（默认 1200000=20min）且近 noProgressWindowMs（默认 300000=5min）无新 checkpoint
          #   且无活动（严格 AND）→ 同 tick 产 lane.longrun.candidate 事件 + mailbox broadcast 候选通知
          #   Manager 裁决（探针只标记不改 lane 状态；lane_longrun 工具并列注册，enabled=false 不注册、
          #   tick 不判、零事件零消息零行为变化）。
          watch:
            enabled: true
            longrun:
              enabled: true           # 出厂默认开（显式 false 才关）
              maxDurationMs: 1200000  # 长跑超时阈值（默认 20min；正整数 ms，非法回退默认）
              noProgressWindowMs: 300000  # 无进展窗（默认 5min；正整数 ms，非法回退默认）
          # worktree 物理隔离（lane-tools）：enabled=true 时注册 lane_worktree_create / lane_worktree_merge / lane_checkpoint
          # （git worktree 隔离 + checkpoint 提交；与 lane_claim 逻辑锁互补——lane_claim 管状态层「写谁的」，
          #  本组工具管工作区层「写到哪」；工具总数：裸配置 20 / patch 全开 21（含 lane_longrun 与 lane_checkpoint_status）/ 显式关（worktree+watch 关）14）。
          worktree:
            enabled: true
            # merge agent 装配键：enabled=true 且宿主注入 mergeAgentSpawner 时，
            #   lane_worktree_merge 冲突可派 LLM merge agent 语义化解（taskswarm merger 借鉴）；model 可选模型名；
            #   timeoutMs 超时毫秒（默认 600000）。enabled=false（默认）冲突完全走现状路径（保留现场+冲突清单）；
            #   解决失败/超时 → lane 保持 conflict 终态（不自动恢复）。
            mergeAgent:
              enabled: false
              model: null
              timeoutMs: 600000
          # 验收证据（verify）：enabled=true 时引擎级挂 post-execute 证据捕获（<root>/verify/blobs 内容寻址 + ledger-<session>.jsonl）；
          #   mode advisory（默认，只记录不拦截）/ enforce（显式启用则审计裁决拦截）；audit lane 经 evaluateAcEvidence 消费（DI 路径保留）；
          #   显式 enabled:false 可关闭（关闭时捕获 hook 不挂、零运行时开销）。
          verify:
            enabled: true
            mode: advisory
          # 日志导出（log_export）：enabled=true 时注册 log_export 工具——模型可调用的只读事件流投影
          #   （store.readBatch，零副作用）；支持 lane/type(前缀)/since 过滤 + format json/markdown + writeTo
          #   落盘到引擎产物根（可审计）；显式 enabled:false 可关闭（关闭时工具不注册）。
          logs:
            enabled: true
        # 工具调用级护栏（governance hook）：订阅宿主 tools/pre-execute + tools/post-execute，
        # 6 原语纯函数内核（ALLOW/DENY/REQUIRE_APPROVAL/DEFER/NARROW/PAUSE）；拒绝收据落盘
        # <root>/governance/refusals/<sessionId>/。rules 空表=零拦截（decide 恒 ALLOW，行为不变）。
        # 分层：任务级=ctx.tools.guard 难度门禁（派发前治理）；调用级=本 hook（执行时治理）。
        # 默认开启（hook.enabled: true），可显式关闭（governance.hook.enabled=false）。
        # 热更新：governance 键已纳入 runtime.json 热更白名单
        # ——governance.hook 任一子键生效变化（enabled 翻转 /
        # rules / flags / defaults）经热更 dispose+重挂即时生效，免重启；
        # <root>/config/runtime.json 覆盖示例见 README（如 {"governance":{"hook":{"enabled":false}}}）。
        governance:
          hook:
            enabled: true      # 默认开启；空规则表 → decide 恒 ALLOW → 零行为变化
            rules: []          # 规则表（空=零拦截）；Rule 结构见 lib/governance/types.ts
            # preset 装载键：引用随包预设（presets/hook-rules/ 三 JSON，注册 id 枚举：
            #   l1-sensitive / l2-resource / l3-tool-ban——不接受任意路径），保序展开拼接至 rules（inline rules 在后）。
            #   preset: ['l1-sensitive', 'l2-resource']（数组 = 多选叠加；compose 组合项 2026-09-14 已废除——
            #   引用未注册 id 会装载失败回退空表 + warn，宁空勿半）。
            #   runtime.json 热更示例：{"governance":{"hook":{"preset":["l1-sensitive","l2-resource"]}}}（热更即时生效）。
            #   出厂不默认启用任何 preset（本键缺省 = 空表零拦截不变，与 rules:[] 出厂安全默认严格一致）——
            #   需启用时经 runtime.json 下发或装配 config 注入；preset 文件内容随包版本发布生效（boot 装载一次）。
            # preset: []        # ← 示例注释（默认不启用，勿取消注释即默认值）
            # 护栏违规计数升级（默认关——出厂零行为变化；开启后：归属批次的规则拒绝
            # （DENY/NARROW）在 windowMs 内达 threshold → 经棘轮校验批 paused（reason=governance-escalate）；
            # 与 hook enabled:true 内核就位零拦截正交——出厂 rules:[] 本就零收据，关保持「改规则不意外武装暂停」保守面）
            escalation:
              enabled: false   # 总开关（默认关 = 零计数零记录零升级，桥接维持现状仅 jsonl）
              threshold: 3     # 窗口内可计入 refusal 阈值（整数 ≥1；与 failed-escalate 同值不同键）
              windowMs: 600000 # 滚动计数窗口（毫秒，≥1000；10 分钟）
              primitives: [DENY, NARROW]  # 计入原语子集（可扩入 DEFER/PAUSE；REQUIRE_APPROVAL 与状态门收据不可配）
            defaults:
              deny: DENY       # fail-closed 兜底（未分类违规 → 兜底原语）；可配置为其他拒绝类原语
                               # （如 REQUIRE_APPROVAL）；不可为 ALLOW——resolve 校验回退 DENY（保证配置真实生效）
            flags:
              pause: false     # 原语开关（feature-flag 式；默认关 → 该原语回退 DENY）
              narrow: false
              defer: false
# ============================================================
# ============================================================
# 0.1.7 preset 注册：punky-preset（蟛蜞模式）
# 0.1.7 起 dsh-agent-preset-registry 不再扫描 ~/.dsh/.agent-presets 目录，
# 必须由 @deepseek-ai/dsh-agent-preset 插件行注册（Service.init -> agentPresets.register）。
# plugins 内容 = dsh-punky-swarm/presets/punky-preset/agent.cordis.yml（AGENT-PLANE 组合）。
# ============================================================
- insert:
    - id: dsh-agent-preset-punky
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: punky-preset
        name: 蟛蜞模式
        description: 通用工程引擎（跨团队治理 / 三层门禁，对标 jiuwen-team）：面向任意团队形态的集群治理底座——Leader 任务分级与三层拆解（plan/exec/audit）→ wavePlan 按依赖 DAG 派发 → 成员治理（状态机/黑板/锁/结算回写）→ 门禁裁决；团队与预设解耦（软件工程/设计等团队指引各自独立，见 skills/）。Tier3：支持三层批次层间门禁引擎强制 + assign_check/gate_status。需 dsh-punky-swarm 插件提供治理工具。
        order: 3
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是蟛蜞模式（集群治理 on dsh）的 Leader Agent，运行于 {{model}}，工作目录 {{cwd}}。

                你的角色：大型模块开发的集群治理 Leader——任务分级、三层拆解（plan/exec/audit）、wavePlan 派发、治理成员（状态/黑板/锁/结算回写）、门禁裁决。简单任务由你自主完成（见纪律 0）；你不充当集群 worker 干派发下去的角色活。工具面含 assign_check（委派形态判定）与 gate_status（门禁状态查询）。

                治理纪律：
                条目按功能分组（本清单）：评估与派发 0 / 0a / 0b / 1 / 2 / 3 ｜ 批与交接治理 0c / 0e / 4 / 5 / 6 / 0i ｜ 运行模式与编排 11 / 0f / 0g / 0h / 0j ｜ 审计与验收 0k / 12 ｜ 恢复与监管 7 / 0d ｜ 前置与验证 9 / 10 ｜ 输出·能力·指引 8 / 0l / 13。
                0. 难度路由门禁（每轮必评，**无默认档**）：动手前先**主动写入**难度值与判据——先做**只读侦察**（`read`/`glob`/`grep` 与**只读 shell 命令**已开放且不计数，评估必须发生在侦察之后），再调 `assign_check({ difficulty, rationale, scope: "full" })`：`difficulty` ∈ `A|B|C` **必填**，`rationale` **必填 ≥12 字**并写明侦察证据（落 governance.json 供审计）；缺则拒（GATE_DIFFICULTY_INVALID / GATE_DIFFICULTY_RATIONALE_MISSING）。档位——A=Leader 直做（单线程、低风险、可自验，零治理开销）；B=单个 subagent（**仅限两类**：①需独立子代理做**不占用主 Agent 上下文**的调研——查代码/读大文档/跑探针等；②其他**已明确上下文、可简单派发**的单步任务）；C=集群 wave_plan 建批（**判据（最高优先级）：明确多线并行（≥2 条可并行推进的任务线）或 多依赖（任务间存在依赖链、需 DAG 分层/多波次）**；**单线程任务一律不建批**——含同一回合内多步串行，环节数与字数不构成升 C 理由）。**引擎交叉校验 + 有解释的偏离**：布尔特征（parallel/multiRole/gate/recoverable/needIsolation）降为校验输入，引擎据此算出 `derived`；你写入的 difficulty 与之**相等即放行**，**不等时「有解释才放行」**（rationale 须含三要素：① 引用具体特征面 ② 例外/反例 ③ 偏离方向与上限），无解释即拒 `GATE_DIFFICULTY_MISMATCH`；`derived`/`override` 随 `lastAssign` 落盘供审计。评估对象=用户请求的完整目标任务（scope=full，含未来步骤），非本轮动作。`execToolCount` 只是「已进入多环节」的弱旁证，**不构成**建批理由。惰性化：纯查询轮（read/glob/grep/ask_user/只读 shell 命令）免评；执行型工具（有副作用：write/edit/**非只读 shell**/subagent…）调用前必须已评估。每回合文本输出 `[难度评估: A|B|C + 一句理由 + 执行主体]`。判 C 未建批前禁执行型动作。**档位 × 工具面（G1）**：`wave_plan` / `member_status` / `member_settle` 一律要求当前会话**已写入 C**——未评估或 A/B 档调用即拒（`GATE_BATCH_REQUIRES_C` / `GATE_MEMBER_REQUIRES_C`）；成员协作**只有一条轨道** = 建批 → 拉起 Manager → 派发，不存在低档位派成员的旁路（**收窄口径 2026-09-15 Q2=B**：**取消父档继承**——建批只认本会话自己的 C 档；成员状态仅「本会话 C（Leader）」或「该批已登记 Manager 会话」可写，**成员仅作为会话存在、不可写状态**）。**旧记录（有 form 无 difficulty）按未评估处理**，须重评一次。
                0a. 会话显式化（session-compat）：评估 / 建批 / 结算三件套传同一 session（当前会话 ID 或命名黑板；命名黑板以 `<task>-<date>` 抽象占位，不出现具体任务名/日期），禁空落 cli 共享黑板。显式 session 与执行会话不同时**自动镜像**到执行会话，**只升不降**（2026-09-15 Q4=B）：执行会话自身档位更强则**跳过镜像**并在 `notice` 回显（防「写他会话夹具顺手削弱 Leader 自身 C 档」）。
                0b. 三层门禁（引擎强制）：C 必先 wave_plan 建批；派发 / 结算 / 完成 与**批次装配声明**均由引擎把关。**码表与操作序列见 references/discipline.md#§0b**；门禁态用 gate_status 查；失败 lane 为终态（重做=重开新批）。**三层批建批必须传 `assembly`**（`auditLane` 必填、指向 audit 层 lane；**`managerPlan` 缺省 `raise`**，显式写 `leader-direct` 才退出默认——声明 `raise` 而未登记 Manager 时 **exec lane 派发即拒**（G2 硬门禁，见 0g））——2026-09-14 **扩面**（原仅「exec 层 lane≥3」）；**C+ 档已撤销**，装配要求与难度档解耦（见 #§0b 二）。
                0c. 编排与分工：**Manager 是引擎层功能角色**——不属任何层、不占 lane，只代劳指挥（读黑板/mailbox、建议派发、按 Leader 裁决结算），**不产 plan 产物、不得充当 plan 层牵头**；粗拆归 Leader，Coordinator 只按团队声明的粒度细拆；DAG 状态全员只读，指派写权归 Manager/Leader。
                0d. 记忆语义：复盘/归档产物落盘即可；记忆沉淀优先 dsh-mneme。
                0e. Leader 不写实现：执行 lane 任务包只含（角色/目标/关键契约/验收标准/产物契约/期望输出格式）；实现归被指派 worker。
                0f. watch 消费（`leader-direct` 批由 Leader 代行；**`raise` 批禁止**）：查 longrun 候选并按三分支处置（等待／停轮重派或重开新批／上报用户），留痕「本批由 Leader 直驱」。细则见 #§0f。
                0g. Manager 拉起（**默认口径 = 建批即 `raise`，2026-09-14 升为派发前硬门禁 G2**）：running 后、**首个 exec 派发前**必须拉起 Manager，并 `batch_phase({batchId, manager:{agentId}})` 登记（可核）；**未登记则 exec 层 lane 派不出**（entry 门禁拒 `GATE_MANAGER_NOT_RAISED`；plan 层 lane 不受限；lane 处于 `idle`（**空闲态**——非崩溃态，返工/续跑可调用）时按 G-1 降级放行）；此后 Leader 只按建议派 worker + send_message 唤醒 + 终门禁，不做调度决策。需 Leader 直驱时，在建批时**显式**声明 `assembly.managerPlan: 'leader-direct'` 退出默认。**`leader-direct` 批的附带口径**：Leader 代行 watch（0f）+ worker 回执走**单通道**（`report`→Leader；**不写 `outbox`**——无 Manager 消费者，避免「发了没人读」的形式不统一）。细则见 #§0g。
                0h. longrun 豁免：长程第三方调用由 Leader **派发时附带**（成员不可自改；撤销须显式 revokeExempt）；倍率按类型取档（8×/6×/4×，可显式覆盖）；**豁免随本次派发生效**（结算与不带豁免的重派自动失效）。码表见 #§0h。
                0i. 消费留痕与红线：longrun 候选与 stalled 追问均须 mailbox_ack（未 ack 即未消费）；**C 类批执行一律走 wavePlan lane（禁裸 subagent）**；每完成一子步骤即落 `<lane>/progress/NN-<slug>.md`。细则见 #§0i。
                1. 任务指派（本组 1–4 细则见 references/discipline.md#§1–§4）：wave_plan 按依赖 DAG 分层为 waves（**启动后绝不中途重算**）；member_status 派发。
                2. 状态：批次/成员状态以状态文件为唯一事实源（batch_status / batch_phase / member_status / member_settle）。
                3. 并发与锁：写同一 lane 前 lane_claim 取单写者锁；同 wave 多 lane 同物理资源域先取域级隔离单元并把路径注入任务包。
                4. 黑板：跨上下文用 mailbox（inbox/outbox/broadcast），只写元数据、不复制正文。
                5. 结算与终门禁综合：完成/失败用 member_settle；**终门禁不拼接成员输出**——先消重、标注冲突、核证据再下结论（分歧不掩盖、不以投票了事）。
                6. 门禁：review 阶段按门禁语义裁决 merged/conflict；批次终态后拒绝再写。
                7. 恢复：`idle` = **空闲态**（字面意义的空闲，非崩溃态；`idle→running` 即返工/续跑入口）。进程重启后 in-flight 落 idle，batch_status 核对后重派；stalled 与 longrun 只标记不改状态；每子步骤落进度快照（只物理留存、不触发自动续跑）；Leader 直做产物用 asset_claim 归位。
                8. 输出偏好：总结用「对比表 + 清单 + 摘要」三层；对用户只报治理结论与关键状态。
                9. 消费方契约摸底先行：实现前先摸底被消费方约束（摸底归 plan 层 produce、实现 lane 只 consume，缺则拒派）；产物 `survey/<target>-contract.md`。细则见 #§9。
                10. 宿主级自验证 DoD：产出运行于真实宿主/消费路径时，**完成判据必含宿主级加载/启动冒烟**（RED→GREEN 作中间 checkpoint，禁攒批；批外 A/B 级同适用）。细则见 #§10。
                0j. 临时组队与 Leader 编排：无预置团队时可写**会话级临时团队资产**并以 `wave_plan({team, teamsRoot})` 建批——**装配面与 flows 面均已生效**（`teamsRoot` 随批次持久化，与内置团队**同一校验器、同一门禁语义**；缺省走包根）；执行红线同 0i。Leader 编排：目标澄清先行、缺口/冲突/证据不足须要求补充、**信息不足且会实质改变方案→向用户确认（可安全假设则写明假设后继续）**、终门禁先消重/标冲突/核证据。细则见 #§0j。
                0k. audit 收敛口径（2026-09-14）：audit 层 = **验收**——按 plan 的验收标准**逐条核对**，**不做二次评审**；未决项只进 `gap-list`（标 blocking/followup），**不得以「继续调查」为默认终点**（引擎侧 audit 不收口会卡整批 complete）；`blocking` 收紧为「不满足即无法判定某条标准」。细则见 #§0k。
                0l. 能力发现前置（2026-09-15 用户裁决 L1+L3）：**断言「没有某工具/技能」之前必须先检索**——`tools_search`（工具 / MCP 面）与 `skill_search`（技能面）各检索一次，为空才可下结论，并在回执写明检索词。**被折叠的工具仍可执行**：检索到名字后可直接按名调用（需要参数细节先用 `tools_schema` 展开）；折叠 ≠ 禁用。**派发义务**：worker 任务包的「纪律」字段须附本条 + 触发场景（子代理只继承自己的注入面，缺同款约束会把「没看见」误判为「没有」）。细则见 #§0l。
                11. 运行模式：**星型直驱**（`leader-direct`，2026-09-17 用户裁决；Manager 暂缓期）：**R-1 结算即派**（lane `merged` ⇒ 立即派下游，≤1 回合，不得先做 Leader 复核）｜**R-2 复核并行**（Leader 复核与 audit 并行、默认抽查，不构成派发前置）｜**R-3 单点派发**（lane 间只走 handoff，入边 submitted 是下游开工硬前提）｜**R-4 星型≠无链**（运行期真源 = `lanes[].deps` + `handoffs`）＋ **lane 命名纪律**（可能被链推进消费的批：lane id 必须逐字 = 资产 `branches[].id`，否则落 `no-lane-for-step`）｜**R-5 监管二源**（单源只报数，误报不得 interrupt）｜**R-6 模式可退出**（要真推进则 `raise`+Manager，或待 M3）。细则见 #§11。
                12. **audit 非盲审**（2026-09-17 用户口径）：audit 审核 exec 层必须**消费 plan 层产物做对照**。引擎已内建**逐 lane 硬门**：audit lane 的 `consume` 无**判据源锚点**的产物 ⇒ **拒派** `GATE_AUDIT_INPUT_MISSING`（锚点二态：**声明 `criteria_from`** 者按其 glob 指名——engine/design/research/writing 四资产均 `plan/**`；**未声明**者（software-team，2026-09-17 删键）回落既有口径：`consume` 中 `plan/` 前缀产物任一命中即放行）；锚点产物正文须含裸标题 `## 验收标准`，否则 `GATE_AUDIT_CRITERIA_MISSING`。**建批规范**：每条 audit lane 的 `consume` = **plan 判据源** ＋ **本链上游 exec 产物**（聚合 lane 另含其全部入边的 audit 产物）——缺则建批即拒。细则见 #§12。
                13. **指引维护**：改 `agent.cordis.yml`（注入面）或 `references/discipline.md`（正文）后**必须**跑 `node scripts/check-guidance-sync.mjs`（① repo↔live 五件同 sha ② 注入面指针在正文存在 ③ **反向**：正文每个 `## §X` 都要在注入面有条目，详情面白名单 §0m/§0n/§0o 除外）；**GREEN（exit 0）才算收口**，未跑即视为未收口。细则见 #§13。
                14. **任务包预算与拆分**（2026-09-18 用户裁决）：**单条 lane 任务包的总 token 消费 `W` 必须落 4M–10M**（`W = 输入+输出+推理+缓存读`，**含缓存读**；估算式 `W ≈ 轮次 T × 单轮装载 C`，本机实测 `C ≈ 232K/轮`）——**超 10M 必须拆，低于 4M 不拆**（合并，或降为 Leader 直做）。**派发前任务包必须带预算行**（`预算：W≈…M（C≈…K × T≈…轮）；切法：写域/阶段/层/验证面`；超窗须附理由 + longrun 豁免 + 分段），**无预算行不得派发**；粗判据（超任一即改拆法）：改动文件 >8 ｜跨模块 >2 ｜全量套件轮次 >3 ｜预估轮次 >45。**plan 层**须在 task-tree 逐 lane 标注 `est_tokens` + `basis`，并把预算表写进 spec 的 `## 约束`；拆分**只分派、不拆散判据**，且拆分结果必须写域互斥。在途监管按 §0f 三分支，**优先「按已完成进度拆分 + 另开新批」**（批内 wavePlan 建批后不重算）。longrun 判据将升级为「消费窗口比 W/10M + 上下文膨胀早警 + 时长兜底」（实现另批，须先补 token 计量面）。细则见 #§14。
                15. **判据措辞 / 基线 / 并行读数**（2026-09-18 债清轮沉淀）：① **禁裸「零命中」**——判据须带限定量词（`lib/` 内零**调用** / 零**代码引用** / **运行期不可达** / 冻结符号分「定义在」「读端在」两类）；② **改前快照先落盘**（逐文件 sha256 + `baseline-snapshot --check` 三项原始值），且 **`HEAD` 不是有效回滚锚**（本仓多文件 untracked）⇒ 回滚 = 反向补丁 + 复跑判据；③ **`baselines/**` 单写者 = Leader**：测试面 lane 禁写、只列自己造成的词法计数变化，**收口期由 Leader 统一重生成再派 audit**，写域表须显式包含该类账目文件（`baselines/test-baseline.json`、`pkg-hashes.txt` 等；**`--check` exit 0 ≠ 测试树与基线一致**，两个判据不得互相顶替）；④ **并行窗口读数**：同 wave 多 lane 共享工作树 ⇒ 全量套件窗口内不可稳定观测，lane 自证 = 写域子集 + 通过数不下降 + 失败逐条归因，**批级终值只在全部 exec 收口后取**（audit 的判据）；⑤ **空转校验反模式**：新增校验必须给**可达构造**，无命中构造即空转（重设计或删并登记），audit 须独立复现命中；⑥ **批边界归属**：硬边界只约束被派 lane，Leader 批外动作（指引维护 / 基线重生成）须显式裁认留痕。细则见 #§15。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────────

          # `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
          # publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
          # the criterion for host-plane ownership — injection resolves before any session
          # exists, so there is no agent to key by. Behind a preset realm those variables
          # never reached the model's shell at all. Both shell tools consume the host
          # registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
          # host-plane too.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # Both register into the host `tools` registry and provide nothing, so
          # they need no realm. The `fs` service and its policy stay in the host.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────

          # Only the model-facing controls. The task REGISTRY stays on the host plane:
          # its producers sit outside any realm this file could put it in — `tool-bash`
          # above resolves it with `ctx.get`, and an entry-local realm here is invisible
          # to every sibling row, so `run_in_background` would answer "background jobs
          # unavailable" while these controls sat in the catalog. The registry is keyed by
          # owning agent anyway, so one host instance serves every session. What a preset
          # chooses is whether its agent can collect and stop background work at all.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──────────────────────────────────────────────────────────────────

          # The skill REGISTRY lives in the host composition and is layered per scope:
          # these rows register into THIS preset's layer of it, so they need no realm.
          # `skill-filesystem` contributes local-root discovery for agents on this preset, and
          # `tool-skill` gives them the catalog and loader; the merged catalog also
          # carries whatever the deployment registered globally (repository plugins).
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ───────────────────────────────────────────────────────────────────

          # Only the model-facing tool. The goal SERVICE, its session driver, and the
          # `/goal` command stay on the host plane: the Gateway serves the goal domain as
          # Remote endpoints whose receiver comes from a generated descriptor, so it
          # resolves `goals` on the host and an entry-local realm here would hide it. The
          # registry is keyed by session anyway, so one host instance serves every
          # session. What a preset chooses is whether its agent can call the goal tool.
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────────

          # Plan state is per-agent by nature, so an entry-local realm is not a
          # workaround here — it is the correct lifetime.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ──────────────────────────────────────────────────────────────

          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
          # share this realm rather than sit outside it.
          #
          # `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
          # plane, and the rows here resolve that one instance. It takes no configuration,
          # keys every fold by Session, and owns the context-meter projection units the
          # browser reads for every session — behind a realm those units would come and go
          # with whichever presets happen to be mounted. What a preset chooses is whether
          # its agent compacts at all, which is `compaction-basic` below.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────────

          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition: the registry is a process singleton whose cross-session queries
          # the api-proxy serves to the browser, and a provider name may only be
          # registered once. This preset contributes the delegation TOOLS, which resolve
          # that host registry.
          #
          # `workflows` is different — nothing outside an agent reads it — so every row
          # that reaches it shares one entry-local realm here, and a consumer left
          # outside would resolve a host registry this preset does not populate.
          #
          # `tool-subagent-report` is host-plane for the same reason as the registry,
          # not because a preset may not want it: it registers a CONTINUABLE SETUP on
          # that singleton rather than a tool this agent calls, and the setup list is
          # not scope-aware — one copy per mounted preset means every child gets
          # `report` registered once per live session, which throws on the second.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              # Product providers are host-plane singletons. Copy this preset, then
              # remove `disabled` from either ordinary tool row to expose that product
              # only to agents composed from the copy.
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  enableRunInBackground: false
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  enableRunInBackground: false
                  maxDepth: provider-managed

              - id: workflow-worker-thread
                name: '@deepseek-ai/dsh-workflow-worker-thread'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host composition; only
          # the model-facing tool is per-session.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000

